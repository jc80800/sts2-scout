name: Windows build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: dotnet restore Sts2Scout.sln
      - run: dotnet build Sts2Scout.sln -c Release --no-restore
      - run: dotnet format Sts2Scout.sln --verify-no-changes --no-restore
      - run: dotnet test tests/Scout.Tests/Scout.Tests.csproj -c Release --no-build --results-directory tests/Scout.Tests/TestResults --logger "trx;LogFileName=tests.trx" --logger "console;verbosity=normal"
      - run: python scripts/smoke_seeder.py
      - run: python scripts/check_boundaries.py
      - run: ./scripts/package.ps1
        shell: pwsh
      - name: Include corresponding source
        run: git archive --format=zip --output=artifacts/Sts2Scout-source.zip HEAD
      - uses: actions/upload-artifact@v7
        with:
          name: Sts2Scout-win-x64
          path: artifacts/Sts2Scout-win-x64/
          retention-days: 30
      - uses: actions/upload-artifact@v7
        with:
          name: Sts2Scout-source
          path: artifacts/Sts2Scout-source.zip
          retention-days: 30
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: tests/Scout.Tests/TestResults/
